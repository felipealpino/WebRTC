<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tela ao vivo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #msg { position: fixed; inset: 50% 0 auto; transform: translateY(-50%); text-align: center; color: #aaa; font: 16px system-ui; }
</style>
<video id="video" autoplay muted playsinline title="Duplo clique: tela cheia"></video>
<div id="msg">Conectando…</div>
<script>
let config, pc;

function setMessage(text) {
  msg.textContent = text;
  msg.hidden = !text;
}

function iceGatheringDone(pc) {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') return resolve();
    pc.addEventListener('icegatheringstatechange', () => pc.iceGatheringState === 'complete' && resolve());
    setTimeout(resolve, 2000);
  });
}

function stop() {
  pc?.close();
  pc = null;
  video.srcObject = null;
}

async function handleOffer(sdp, ws) {
  stop();
  const conn = (pc = new RTCPeerConnection({ iceServers: config.iceServers }));
  conn.ontrack = (e) => {
    e.receiver.jitterBufferTarget = 0; // menor latência possível
    video.srcObject = e.streams[0];
  };
  conn.onconnectionstatechange = () => {
    if (conn.connectionState === 'connected') setMessage('');
    if (conn.connectionState === 'failed') ws.close(); // reconecta e renegocia
  };
  await conn.setRemoteDescription(sdp);
  await conn.setLocalDescription();
  await iceGatheringDone(conn);
  ws.send(JSON.stringify({ type: 'answer', sdp: conn.localDescription }));
}

function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'viewer' }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'offer') handleOffer(m.sdp, ws).catch((err) => console.error(err));
    if (m.type === 'broadcaster-left') {
      stop();
      setMessage('Aguardando transmissão…');
    }
  };
  ws.onclose = () => {
    stop();
    setMessage('Reconectando…');
    setTimeout(connect, 2000);
  };
}

video.ondblclick = () => (document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen());

fetch('/config.json')
  .then((r) => r.json())
  .then((c) => {
    config = c;
    connect();
  });
</script>
</html>
