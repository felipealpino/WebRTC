<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Transmissor</title>
<body style="font: 14px system-ui; background: #111; color: #eee; padding: 16px">
<p id="msg">Iniciando…</p>
<button id="start" hidden>Compartilhar tela</button>
<script>
// ?auto: aberta pelo app (WebView2 oculto), que já aceita a captura da tela inteira sozinho.
// Sem ?auto: navegador comum, que exige clique e mostra o seletor de tela.
const auto = new URLSearchParams(location.search).has('auto');
let config, stream;
const peers = new Map();

function log(text) {
  msg.textContent = text;
  fetch('/log', { method: 'POST', body: text }).catch(() => {});
}

function iceGatheringDone(pc) {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') return resolve();
    pc.addEventListener('icegatheringstatechange', () => pc.iceGatheringState === 'complete' && resolve());
    setTimeout(resolve, 2000);
  });
}

function capture() {
  return navigator.mediaDevices.getDisplayMedia({
    audio: false,
    video: { width: { max: 1920 }, height: { max: 1080 }, frameRate: { ideal: config.fps, max: config.fps } },
  });
}

async function addViewer(id, ws) {
  peers.get(id)?.close();
  const pc = new RTCPeerConnection({ iceServers: config.iceServers });
  peers.set(id, pc);

  const transceiver = pc.addTransceiver(stream.getVideoTracks()[0], {
    direction: 'sendonly',
    streams: [stream],
    sendEncodings: [{ maxBitrate: config.maxBitrate, maxFramerate: config.fps }],
  });
  // H.264 primeiro: costuma ter codificação/decodificação por hardware no Windows e no Mac.
  const codecs = RTCRtpSender.getCapabilities('video').codecs;
  const isH264 = (c) => c.mimeType === 'video/H264';
  if (codecs.some(isH264)) transceiver.setCodecPreferences([...codecs.filter(isH264), ...codecs.filter((c) => !isH264(c))]);

  pc.onconnectionstatechange = () => updateStatus();
  await pc.setLocalDescription();
  await iceGatheringDone(pc);
  ws.send(JSON.stringify({ type: 'offer', to: id, sdp: pc.localDescription }));
}

let lastStatus;
function updateStatus() {
  const { width, height, frameRate } = stream.getVideoTracks()[0].getSettings();
  const watching = [...peers.values()].filter((pc) => pc.connectionState === 'connected').length;
  const status = `Capturando ${width}x${height} @ ${Math.round(frameRate)} fps — ${watching} assistindo`;
  if (status !== lastStatus) log((lastStatus = status));
}

function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'broadcaster' }));
    updateStatus();
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'viewer-joined') addViewer(m.id, ws).catch((err) => log(`Erro com espectador: ${err.message}`));
    if (m.type === 'answer') peers.get(m.from)?.setRemoteDescription(m.sdp);
    if (m.type === 'viewer-left') {
      peers.get(m.id)?.close();
      peers.delete(m.id);
      updateStatus();
    }
  };
  ws.onclose = () => {
    for (const pc of peers.values()) pc.close();
    peers.clear();
    setTimeout(connect, 1000);
  };
}

async function main() {
  config = await (await fetch('/config.json')).json();
  stream = await capture();
  const track = stream.getVideoTracks()[0];
  track.contentHint = 'motion'; // prioriza manter os FPS
  track.onended = () => (auto ? location.reload() : log('Captura encerrada.'));
  connect();
}

if (auto) {
  main().catch((err) => {
    log(`Erro ao capturar a tela: ${err.name}: ${err.message}. Tentando de novo em 5 s…`);
    setTimeout(() => location.reload(), 5000);
  });
} else {
  msg.textContent = 'Clique para escolher a tela a transmitir.';
  start.hidden = false;
  start.onclick = () => {
    start.hidden = true;
    main().catch((err) => log(`Erro: ${err.message}`));
  };
}
</script>
</body>
</html>
