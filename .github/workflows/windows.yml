# Compila o .exe para Windows a cada push na main e publica na release "latest".
name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Compilar
        working-directory: src-tauri
        run: cargo build --release

      - name: Publicar na release "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Última versão" --notes ""
          gh release edit latest --notes "Build automático do commit ${GITHUB_SHA::7}."
          gh release upload latest src-tauri/target/release/transmissao-tela.exe --clobber
